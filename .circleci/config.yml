version: 2.1

executors:
  node-executor:
    docker:
      # Official Node 20 image tagged with Playwright dependencies pre-installed
      - image: mcr.microsoft.com/playwright:v1.49.0-jammy

jobs:
  scrape-and-sync:
    executor: node-executor
    steps:
      - checkout

      # Restore npm cache
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package-lock.json" }}
            - v1-deps-

      - run:
          name: Install Dependencies
          command: npm ci

      # Save npm cache
      - save_cache:
          key: v1-deps-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

      # Restore Playwright Browsers Cache
      - restore_cache:
          keys:
            - v1-playwright-{{ checksum "package-lock.json" }}

      - run:
          name: Install Playwright Chromium
          command: npx playwright install chromium

      # Save Playwright Browsers Cache
      - save_cache:
          key: v1-playwright-{{ checksum "package-lock.json" }}
          paths:
            - ~/.cache/ms-playwright

      - run:
          name: Run Scraper and Sync to MongoDB
          command: npx playwright test
          # Environment variables are automatically pulled from CircleCI Project Settings

workflows:
  version: 2
  # Manual trigger / push pipeline
  manual-or-push:
    jobs:
      - scrape-and-sync

  # Scheduled Cron Pipeline (30 8,13 * * 0-4 UTC)
  scheduled-scraper:
    triggers:
      - schedule:
          cron: "30 8,13 * * 0-4"
          filters:
            branches:
              only:
                - main  # Change to your default branch if it's 'master'
    jobs:
      - scrape-and-sync
